<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inventory Management - Textile ERP</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="full-page-scroll">
    <div class="admin-grid">
      
      <!-- 1. Brand Creator -->
      <div class="card">
        <h2>➕ Add New Brand</h2>
        <form onsubmit="handleCreateBrand(event)">
          <label>Root Category:</label>
          <select id="catSelect" required></select>
          
          <label>Brand Name:</label>
          <input type="text" id="brandName" placeholder="e.g. Shaheen Velvet" required>

          <button type="submit" class="btn-action">Create Brand</button>
        </form>
      </div>

      <!-- 2. SKU Creator with Category -> Brand Cascade -->
      <div class="card" style="grid-column: span 2;">
        <h2>➕ Create Product SKU</h2>
        <form onsubmit="handleCreateProduct(event)">
          
          <!-- Cascading Category -> Brand -->
          <div class="row-fields">
            <div>
              <label>1. Select Category:</label>
              <select id="skuCategorySelect" onchange="onSkuCategoryChange()" required></select>
            </div>
            <div>
              <label>2. Select Brand:</label>
              <select id="skuBrandSelect" required>
                <option value="">-- Choose Category First --</option>
              </select>
            </div>
          </div>

          <div class="row-fields">
            <div>
              <label>Product Display Name *:</label>
              <input type="text" id="nameInput" placeholder="e.g. Royal Silk Red Thread" required>
            </div>
            <div>
              <label>SKU Code *:</label>
              <input type="text" id="skuInput" placeholder="e.g. SH-RED-01" required>
            </div>
          </div>

          <div class="row-fields">
            <div>
              <label>Spools per Carton (Ratio) *:</label>
              <input type="number" id="ratioInput" value="24" min="1" required>
            </div>
            <div>
              <label>Initial Physical Stock (Total Spools):</label>
              <input type="number" id="stockInput" value="0" min="0">
            </div>
          </div>

          <div class="row-fields">
            <div>
              <label>Default Cost / Spool ($):</label>
              <input type="number" step="0.01" id="costInput" value="0.00">
            </div>
            <div>
              <label>Default Retail / Spool ($):</label>
              <input type="number" step="0.01" id="retailInput" value="0.00">
            </div>
            <div>
              <label>Default Wholesale / Ctn ($):</label>
              <input type="number" step="0.01" id="wholesaleInput" value="0.00">
            </div>
          </div>

          <button type="submit" class="btn-action">Save Product SKU</button>
        </form>
      </div>

      <!-- 3. Master SKU Catalog Table with Live Search & Filter Bar -->
      <div class="card" style="grid-column: 1 / -1; margin-top: 10px; padding:0; overflow:hidden;">
        
        <!-- Filter Header Bar -->
        <div style="padding: 16px; background:#f8fafc; border-bottom: 1px solid #e2e8f0; display:flex; flex-wrap:wrap; gap: 12px; align-items:center;">
          <input type="text" id="catalogSearchInput" oninput="filterMasterCatalog()" 
                 placeholder="🔍 Search SKU code or product name..." 
                 style="flex:2; min-width: 200px; padding:8px 12px; border:1px solid #cbd5e1; border-radius:4px;">

          <select id="catalogCategoryFilter" onchange="filterMasterCatalog()" 
                  style="flex:1; min-width: 160px; padding:8px; border:1px solid #cbd5e1; border-radius:4px;">
            <option value="">-- All Categories --</option>
          </select>

          <select id="catalogStatusFilter" onchange="filterMasterCatalog()" 
                  style="flex:1; min-width: 140px; padding:8px; border:1px solid #cbd5e1; border-radius:4px;">
            <option value="ALL">All Statuses</option>
            <option value="ACTIVE" selected>Active Only</option>
            <option value="INACTIVE">Deactivated Only</option>
          </select>

          <span id="catalogCountBadge" style="font-weight:700; color:#64748b; font-size:0.85rem;">Showing: 0</span>
        </div>

        <div class="table-wrapper" style="max-height: 550px;">
          <table class="data-table">
            <thead>
              <tr>
                <th>SKU</th>
                <th>Product Name</th>
                <th>Category & Brand</th>
                <th>Ratio</th>
                <th>Current Stock</th>
                <th>Cost</th>
                <th>Retail</th>
                <th>Wholesale Ctn</th>
                <th>Status</th>
                <th style="text-align:right;">Actions</th>
              </tr>
            </thead>
            <tbody id="inventoryCatalogBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <!-- Reusable SKU Edit Modal -->
  <div class="modal-overlay" id="editProductModal">
    <div class="modal-content" style="width: 480px; text-align: left;">
      <h3>✏️ Edit Product SKU</h3>
      <p style="font-size:0.8rem; color:#64748b; margin-bottom: 12px;">Past invoices retain their original price and ratio snapshots.</p>

      <form onsubmit="handleSaveProductEdit(event)">
        <input type="hidden" id="editProdId">

        <div class="row-fields">
          <div>
            <label>SKU Code *:</label>
            <input type="text" id="editProdSku" required style="width:100%; padding:8px; margin-bottom:8px;">
          </div>
          <div>
            <label>Spools / Carton (Ratio) *:</label>
            <input type="number" id="editProdRatio" min="1" required style="width:100%; padding:8px; margin-bottom:8px;">
          </div>
        </div>

        <label>Product Display Name *:</label>
        <input type="text" id="editProdName" required style="width:100%; padding:8px; margin-bottom:8px;">

        <div class="row-fields">
          <div>
            <label>Default Cost / Spool ($):</label>
            <input type="number" step="0.01" id="editProdCost" style="width:100%; padding:8px; margin-bottom:8px;">
          </div>
          <div>
            <label>Default Retail / Spool ($):</label>
            <input type="number" step="0.01" id="editProdRetail" style="width:100%; padding:8px; margin-bottom:8px;">
          </div>
          <div>
            <label>Wholesale / Ctn ($):</label>
            <input type="number" step="0.01" id="editProdWholesale" style="width:100%; padding:8px; margin-bottom:8px;">
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeEditProductModal()">Cancel</button>
          <button type="submit" class="btn-confirm">Save Product Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/nav.js"></script>
  <script src="/js/inventory.js"></script>
</body>
</html>

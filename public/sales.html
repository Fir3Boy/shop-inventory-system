<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sales Counter - Textile ERP</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-container">
    
    <!-- Catalog Drill-Down -->
    <section class="pos-catalog">
      <div class="breadcrumb-bar" id="salesBreadcrumbs"></div>
      <div class="tiles-grid" id="salesTiles"></div>
    </section>

    <!-- Outbound Draft Sheet with Live Cash Handling -->
    <aside class="pos-invoice">
      <div class="sheet-header">
        <h2>Customer Sales Invoice</h2>
        <div class="field-group">
          <label>Customer:</label>
          <select id="partySelect" onchange="draftEngine.handlePartyChange()"></select>
        </div>
      </div>

      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr><th>Item</th><th>Unit</th><th>Qty</th><th>Price</th><th>Total</th><th></th></tr>
          </thead>
          <tbody id="invoiceItemsBody"></tbody>
        </table>
      </div>

      <!-- Financial Breakdown & Cash Settlement -->
      <div class="sheet-footer">
        <div class="summary-line" style="display:flex; justify-content:space-between; margin-bottom: 4px; color:#64748b;">
          <span>Previous Debt Balance:</span>
          <span id="txtOldBalance">$0.00</span>
        </div>
        
        <div class="summary-line" style="display:flex; justify-content:space-between; margin-bottom: 10px; font-size:1.15rem; font-weight:700;">
          <span>Current Bill Total:</span>
          <span id="txtBillTotal">$0.00</span>
        </div>

        <!-- Cash Payment Section -->
        <div style="background:#f1f5f9; padding: 10px; border-radius: 6px; margin-bottom: 12px; border: 1px solid #cbd5e1;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 6px;">
            <label style="font-weight:700; font-size:0.9rem;">Cash Received Today ($):</label>
            <button type="button" class="btn-action" style="padding: 4px 10px; font-size:0.8rem; background:#0f172a;" onclick="draftEngine.setFullCash()">
              💵 Paid in Full
            </button>
          </div>
          <input type="number" id="inputCashPaid" step="10.00" value="0.00" oninput="draftEngine.calculateBalances()" 
                 style="width:100%; padding:10px; font-size:1.25rem; font-weight:800; border:1px solid #94a3b8; border-radius:4px; text-align:right;">
        </div>

        <div class="total-row" style="font-size:1.1rem; color:#1e293b; margin-bottom: 12px;">
          <span>New Total Debt Balance:</span>
          <span id="txtNewBalance">$0.00</span>
        </div>

        <button class="btn-commit" onclick="draftEngine.commit(this)">✓ COMMIT SALE</button>
      </div>
    </aside>

  </div>

  <!-- Reusable Touch Selection Modal -->
  <div class="modal-overlay" id="unitModal">
    <div class="modal-content">
      <h3 id="modalProductName">Select Unit & Quantity</h3>
      <p id="modalStockInfo" style="font-size:0.85rem; color:#64748b; margin: 8px 0;"></p>
      
      <div class="unit-toggle-group">
        <button class="unit-btn active" id="btnUnitCarton" onclick="setModalUnit('CARTON')">Carton</button>
        <button class="unit-btn" id="btnUnitSpool" onclick="setModalUnit('SPOOL')">Spool</button>
      </div>

      <div class="counter-box">
        <button class="btn-circle" onclick="adjustModalQty(-1)">-</button>
        <span class="qty-display" id="qtyDisplay">1</span>
        <button class="btn-circle" onclick="adjustModalQty(1)">+</button>
      </div>

      <!-- Updated Price Box with Cost Badge & Live Profit Feedback -->
      <div class="price-box">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 6px;">
          <label style="font-size:0.85rem; font-weight:bold;">Agreed Selling Price ($):</label>
          <!-- 1. The Cost Badge -->
          <span id="txtLastCostHint" style="font-size:0.75rem; background:#fef3c7; color:#92400e; padding:3px 8px; border-radius:4px; font-weight:700;">
            Cost: $0.00
          </span>
        </div>

        <!-- 2. Price input with live update listener -->
        <input type="number" id="modalPriceInput" step="0.01" oninput="draftEngine.updateMarginDisplay()">

        <!-- 3. The Green/Red Profit/Loss message appears here -->
        <div id="txtMarginFeedback" style="margin-top:6px; font-size:0.8rem; font-weight:700;"></div>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-confirm" onclick="confirmAddItem()">Add to Sheet</button>
      </div>
    </div>
  </div>

  <script src="js/nav.js"></script>
  <script src="js/cascade.js"></script>
  <script src="js/invoice-draft.js"></script>
  <script>
    // Pass 3 arguments (engine will bind to the new balance elements)
   const draftEngine = new InvoiceDraftEngine('OUT', 'partySelect', 'invoiceItemsBody');
   const catalog = new CatalogDrillDown('salesTiles', 'salesBreadcrumbs', (p) => draftEngine.openAddModal(p));
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stock Audit & Damage Adjustments - Textile ERP</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="full-page-scroll">

    <div class="print-only-header">
      <h1>Textile Store - Official Stock Audit & Write-Off Report</h1>
      <p id="printMetaDetails"></p>
    </div>

    <!-- Header Actions -->
    <div class="report-header-row no-print">
      <div style="display:flex; align-items:center; gap: 12px;">
        <button class="btn-preset" onclick="location.href='/reports.html'">&larr; Back to Directory</button>
        <h2>Inventory Audit & Damage Adjustments</h2>
      </div>
      <button class="btn-action" style="background:#0f172a;" onclick="window.print()">
        🖨️ Print Loss Statement
      </button>
    </div>

    <!-- 1. Audit Entry Card -->
    <div class="card no-print" style="margin-bottom: 20px; border-left: 5px solid #d97706;">
      <h2>📦 Record Shelf Count / Damage Adjustment</h2>
      <form onsubmit="handleAuditSubmit(event)">
        
        <!-- Cascading Drill-Down: Category -> Brand -> SKU -->
        <div class="row-fields" style="margin-bottom: 12px;">
          <div>
            <label>1. Category:</label>
            <select id="auditCategorySelect" onchange="onAuditCategoryChange()">
              <option value="">-- Choose Category --</option>
            </select>
          </div>

          <div>
            <label>2. Brand:</label>
            <select id="auditBrandSelect" onchange="onAuditBrandChange()">
              <option value="">-- Choose Brand --</option>
            </select>
          </div>

          <div style="flex: 1.5;">
            <label>3. Select Product to Audit *:</label>
            <select id="auditProductSelect" onchange="onAuditProductChange()" required>
              <option value="">-- Choose Product SKU --</option>
            </select>
          </div>
        </div>

        <!-- Current Stock Display Box -->
        <div style="margin-bottom: 12px;">
          <label>Current System Stock Recorded on Computer:</label>
          <input type="text" id="txtCurrentStock" readonly 
                 style="background:#f1f5f9; font-weight:700; width:100%; padding:10px;" 
                 placeholder="Select a product above to inspect current stock...">
        </div>

        <!-- Physical Count (Dual Unit Inputs) -->
        <div style="background:#f8fafc; padding: 12px; border-radius: 6px; border:1px solid #cbd5e1; margin: 12px 0;">
          <label style="font-weight:700; color:#0f172a; margin-bottom: 6px; display:block;">
            Actual Physical Stock Counted on Shelf:
          </label>
          <div class="row-fields">
            <div>
              <label>Whole Cartons Found:</label>
              <input type="number" id="inputPhysicalCartons" min="0" value="0" oninput="calculatePhysicalTotal()" style="font-size:1.1rem; font-weight:700;">
            </div>
            <div>
              <label>Loose Spools Found:</label>
              <input type="number" id="inputPhysicalLoose" min="0" value="0" oninput="calculatePhysicalTotal()" style="font-size:1.1rem; font-weight:700;">
            </div>
            <div>
              <label>Calculated Total Spools:</label>
              <input type="number" id="inputTotalPhysicalSpools" readonly style="background:#e2e8f0; font-size:1.2rem; font-weight:800;">
            </div>
          </div>

          <!-- Live Difference Indicator -->
          <div id="txtDiscrepancyPreview" style="margin-top: 8px; font-weight:700; font-size:0.95rem;"></div>
        </div>

        <!-- Reason & Notes -->
        <div class="row-fields">
          <div style="flex:1;">
            <label>Audit Reason / Cause *:</label>
            <select id="selectAdjustmentType" required>
              <option value="DAMAGE">📦 Physical Damage / Water / Dust</option>
              <option value="WASTE_CUTTING">✂️ Waste & Cutting Remnants</option>
              <option value="MISSING_THEFT">❓ Missing / Unaccounted Theft</option>
              <option value="FOUND_EXTRA">➕ Found Extra Stock on Shelf</option>
              <option value="CORRECTION">⚙️ Data Entry / System Miscount</option>
            </select>
          </div>
          <div style="flex:2;">
            <label>Notes / Explanation:</label>
            <input type="text" id="inputAuditNotes" placeholder="e.g. Water leak on bottom rack, 3 spools ruined">
          </div>
        </div>

        <button type="submit" class="btn-action" style="margin-top: 12px; background:#d97706;">
          ✓ Confirm Stock Adjustment
        </button>
      </form>
    </div>

    <!-- 2. KPI Summary Cards -->
    <div class="kpi-grid" id="auditKpis"></div>

    <!-- 3. Audit Log History Table -->
    <div class="card" style="padding:0; overflow:hidden;">
      <div style="padding: 12px 16px; background:#f8fafc; border-bottom: 1px solid #e2e8f0;">
        <h3 style="font-size: 1rem;">Audit & Write-Off Log</h3>
      </div>
      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Product SKU</th>
              <th>Reason</th>
              <th>Computer Stock</th>
              <th>Counted Shelf</th>
              <th>Discrepancy (Δ)</th>
              <th>Cost Loss ($)</th>
              <th>Notes</th>
            </tr>
          </thead>
          <tbody id="auditTableBody"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="/js/nav.js"></script>
  <script src="/js/reports/stock-audit.js"></script>
</body>
</html>

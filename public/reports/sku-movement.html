<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SKU Movements & Stock Card - Textile ERP</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="full-page-scroll">

    <!-- Print Only Document Header -->
    <div class="print-only-header">
      <h1>Textile Store - SKU Movement & Stock Card</h1>
      <p id="printMetaDetails"></p>
    </div>

    <!-- Top Action Bar -->
    <div class="report-header-row no-print">
      <div style="display:flex; align-items:center; gap: 12px;">
        <button class="btn-preset" onclick="location.href='/reports.html'">&larr; Back to Directory</button>
        <h2>SKU Movement History & Stock Card</h2>
      </div>
      <button class="btn-action" style="background:#0f172a;" onclick="window.print()">
        🖨️ Print / Save as PDF
      </button>
    </div>

    <!-- Filter Card -->
    <div class="filter-card no-print">
      <div class="preset-buttons">
        <span style="font-size:0.85rem; font-weight:700; align-self:center; margin-right:4px;">Date Range:</span>
        <button class="btn-preset" onclick="setPreset('today')">Today</button>
        <button class="btn-preset" onclick="setPreset('week')">This Week</button>
        <button class="btn-preset" onclick="setPreset('month')">This Month</button>
        <button class="btn-preset" onclick="setPreset('all')">All Time</button>
      </div>

      <div class="filter-grid" style="grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));">
        <div class="filter-group">
          <label>Start Date:</label>
          <input type="date" id="filterStartDate">
        </div>

        <div class="filter-group">
          <label>End Date:</label>
          <input type="date" id="filterEndDate">
        </div>

        <div class="filter-group">
          <label>Flow Type:</label>
          <select id="filterMovementType">
            <option value="ALL">All Flows (IN & OUT)</option>
            <option value="OUT">Sales Only (Outflow)</option>
            <option value="IN">Purchases Only (Inflow)</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Category:</label>
          <select id="filterCategorySelect" onchange="onCategoryChange()">
            <option value="">-- All Categories --</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Brand:</label>
          <select id="filterBrandSelect" onchange="onBrandChange()">
            <option value="">-- All Brands --</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Specific SKU:</label>
          <select id="filterProductSelect">
            <option value="">-- All SKUs --</option>
          </select>
        </div>

        <button class="btn-action" onclick="fetchMovementReport()">🔍 Run Report</button>
      </div>
    </div>

    <!-- KPI Summary Cards -->
    <div class="kpi-grid" id="movementKpis"></div>

    <!-- Audit Table -->
    <div class="card" style="padding:0; overflow:hidden;">
      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Flow</th>
              <th>Invoice # / Ref</th>
              <th>Party (Customer / Mill)</th>
              <th>Product / SKU</th>
              <th>Quantity Sold/Bought</th>
              <th>Stock Impact (Base Spools)</th>
              <th>Rate ($)</th>
              <th>Total Amount</th>
            </tr>
          </thead>
          <tbody id="movementsTableBody"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="/js/nav.js"></script>
  <script src="/js/reports/sku-movement.js"></script>
</body>
</html>

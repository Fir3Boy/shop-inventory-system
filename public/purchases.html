<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stock Inward (Purchases) - Textile ERP</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-container">
    
    <section class="pos-catalog">
      <div class="breadcrumb-bar" id="purBreadcrumbs"></div>
      <div class="tiles-grid" id="purTiles"></div>
    </section>

    <!-- Inbound Draft Sheet with Mode Switcher -->
    <aside class="pos-invoice" id="invoicePanel">
      <div class="sheet-header">
        
        <!-- Tactile Purchase vs Return Mode Toggle -->
        <div style="display:flex; gap: 8px; margin-bottom: 12px;">
          <button type="button" id="btnModePurchase" class="btn-action" 
                  style="flex:1; padding: 10px; background:#7c3aed; font-weight:800;" 
                  onclick="draftEngine.setMode(false)">
            📦 Inward Stock
          </button>
          <button type="button" id="btnModeReturn" class="btn-action" 
                  style="flex:1; padding: 10px; background:#334155; color:#94a3b8; font-weight:800;" 
                  onclick="draftEngine.setMode(true)">
            🔄 Return to Mill
          </button>
        </div>

        <h2 id="txtInvoiceTitle" style="color: #f8fafc;">Stock IN (Supplier Purchase)</h2>

        <!-- Supplier Search & Dropdown -->
        <div class="field-group" style="align-items: flex-start; margin-top: 8px;">
          <label style="margin-top: 6px; color: #94a3b8;">Supplier:</label>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
            <input type="text" id="partySearchInput" placeholder="🔍 Quick search mill, rep, phone..." 
                   oninput="draftEngine.filterParties(this.value)" 
                   style="width: 100%; padding: 6px 10px; border: 1px solid #475569; border-radius: 4px; font-size: 0.85rem; background: #0f172a; color: #f8fafc;">
            <select id="partySelect" onchange="draftEngine.handlePartyChange()" style="width: 100%; background: #0f172a; color: #f8fafc; border: 1px solid #475569; padding: 8px; border-radius: 4px;"></select>
          </div>
        </div>

        <div class="field-group" style="margin-top: 8px;">
          <label id="lblNotes" style="color: #94a3b8;">Mill Bill #:</label>
          <input type="text" id="inputInvoiceNotes" placeholder="Original Paper Invoice / Delivery Bill #"
                 style="flex:1; padding:8px 12px; border-radius:4px; border:1px solid #475569; font-size:0.95rem; background: #0f172a; color: #f8fafc;">
        </div>
      </div>

      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr><th>Item</th><th>Unit</th><th>Qty</th><th>Cost</th><th>Total</th><th></th></tr>
          </thead>
          <tbody id="invoiceItemsBody"></tbody>
        </table>
      </div>

      <!-- Financial Breakdown & Cash Outflow -->
      <div class="sheet-footer">
        <div class="summary-line" style="display:flex; justify-content:space-between; margin-bottom: 4px; color:#94a3b8;">
          <span>Current Balance Owed:</span>
          <span id="txtOldBalance">SAR 0.00</span>
        </div>
        
        <div class="summary-line" style="display:flex; justify-content:space-between; margin-bottom: 10px; font-size:1.15rem; font-weight:700; color: #f8fafc;">
          <span id="txtBillTotalLabel">Current Inward Total:</span>
          <span id="txtBillTotal">SAR 0.00</span>
        </div>

        <!-- Cash Section -->
        <div style="background:#0f172a; padding: 10px; border-radius: 6px; margin-bottom: 12px; border: 1px solid #334155;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 6px;">
            <label id="lblCashPaid" style="font-weight:700; font-size:0.9rem; color: #94a3b8;">Cash Paid to Supplier (SAR ):</label>
            <button type="button" class="btn-action" id="btnQuickCash" 
                    style="padding: 4px 10px; font-size:0.8rem; background:#1e293b; color: #f8fafc; border: 1px solid #334155;" 
                    onclick="draftEngine.setFullCash()">
              💵 Exact Match
            </button>
          </div>
          <input type="number" id="inputCashPaid" step="10" value="0.00" oninput="draftEngine.calculateBalances()" 
                 style="width:100%; padding:10px; font-size:1.25rem; font-weight:800; border:1px solid #475569; border-radius:4px; text-align:right; background: #1e293b; color: #f8fafc;">
        </div>

        <div class="total-row" style="font-size:1.05rem; color:#f8fafc; margin-bottom: 12px;">
          <span>New Balance With Supplier:</span>
          <span id="txtNewBalance">SAR 0.00</span>
        </div>

        <button class="btn-commit purchase" id="btnCommitInvoice" onclick="draftEngine.commit(this)">
          + COMMIT STOCK IN (PURCHASE)
        </button>
      </div>
    </aside>

  </div>

  <!-- Reusable Touch Selection Modal for Inward Stock -->
  <div class="modal-overlay" id="unitModal">
    <div class="modal-content" style="background: #1e293b; border: 1px solid #334155; color: #f8fafc;">
      <h3 id="modalProductName" style="color: #f8fafc;">Select Unit & Quantity</h3>
      <p id="modalStockInfo" style="font-size:0.85rem; color:#94a3b8; margin: 8px 0;"></p>
      
      <div class="unit-toggle-group">
        <button class="unit-btn active" id="btnUnitCarton" onclick="setModalUnit('CARTON')">Carton</button>
        <button class="unit-btn" id="btnUnitSpool" onclick="setModalUnit('SPOOL')">Spool</button>
      </div>

      <div class="counter-box">
        <button class="btn-circle" onclick="adjustModalQty(-1)">-</button>
        <span class="qty-display" id="qtyDisplay" style="color: #f8fafc;">1</span>
        <button class="btn-circle" onclick="adjustModalQty(1)">+</button>
      </div>

      <!-- Cost & Supplier Price-Hike Tracker -->
      <div class="price-box" style="background: #0f172a; border: 1px dashed #475569;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 6px;">
          <label style="font-size:0.85rem; font-weight:bold; color: #94a3b8;">Supplier Cost per Unit (SAR ):</label>
          <!-- Badge showing previous purchase price -->
          <span id="txtLastCostHint" style="font-size:0.75rem; background:#312e81; color:#c7d2fe; padding:3px 8px; border-radius:4px; font-weight:700; border: 1px solid #4338ca;">
            Prev Cost: SAR 0.00
          </span>
        </div>

        <!-- Inward cost input -->
        <input type="number" id="modalPriceInput" step="10" oninput="draftEngine.updateMarginDisplay()" style="background: #1e293b; color: #f8fafc; border: 1px solid #475569;">

        <!-- Shows if supplier raised or reduced the price -->
        <div id="txtMarginFeedback" style="margin-top:6px; font-size:0.8rem; font-weight:700;"></div>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-confirm" onclick="confirmAddItem()">Add to Sheet</button>
      </div>
    </div>
  </div>

  <script src="js/nav.js"></script>
  <script src="js/cascade.js"></script>
  <script src="js/invoice-draft.js"></script>
  <script>
    // Initialized for Stock IN (Purchases)
    const draftEngine = new InvoiceDraftEngine('IN', 'partySelect', 'invoiceItemsBody');
    const catalog = new CatalogDrillDown('purTiles', 'purBreadcrumbs', (p) => draftEngine.openAddModal(p));
  </script>
</body>
</html>

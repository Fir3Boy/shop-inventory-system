<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stock Inward (Purchases) - Textile ERP</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-container">
    
    <section class="pos-catalog">
      <div class="breadcrumb-bar" id="purBreadcrumbs"></div>
      <div class="tiles-grid" id="purTiles"></div>
    </section>

    <!-- Inbound Draft Sheet with Live Cash/Credit Handling -->
    <aside class="pos-invoice">
      <div class="sheet-header">
        <h2>Stock IN (Supplier Purchase)</h2>
        <div class="field-group">
          <label>Supplier:</label>
          <select id="partySelect" onchange="draftEngine.handlePartyChange()"></select>
        </div>
      </div>

      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr><th>Item</th><th>Unit</th><th>Qty</th><th>Cost</th><th>Total</th><th></th></tr>
          </thead>
          <tbody id="invoiceItemsBody"></tbody>
        </table>
      </div>

      <!-- Financial Breakdown & Cash Outflow -->
      <div class="sheet-footer">
        <div class="summary-line" style="display:flex; justify-content:space-between; margin-bottom: 4px; color:#64748b;">
          <span>Previous Balance Owed:</span>
          <span id="txtOldBalance">$0.00</span>
        </div>
        
        <div class="summary-line" style="display:flex; justify-content:space-between; margin-bottom: 10px; font-size:1.15rem; font-weight:700;">
          <span>Current Inward Total:</span>
          <span id="txtBillTotal">$0.00</span>
        </div>

        <!-- Cash Paid to Supplier Section -->
        <div style="background:#f1f5f9; padding: 10px; border-radius: 6px; margin-bottom: 12px; border: 1px solid #cbd5e1;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 6px;">
            <label style="font-weight:700; font-size:0.9rem;">Cash Paid to Supplier ($):</label>
            <button type="button" class="btn-action" style="padding: 4px 10px; font-size:0.8rem; background:#7c3aed;" onclick="draftEngine.setFullCash()">
              💵 Paid in Full
            </button>
          </div>
          <input type="number" id="inputCashPaid" step="0.01" value="0.00" oninput="draftEngine.calculateBalances()" 
                 style="width:100%; padding:10px; font-size:1.25rem; font-weight:800; border:1px solid #94a3b8; border-radius:4px; text-align:right;">
        </div>

        <div class="total-row" style="font-size:1.1rem; color:#1e293b; margin-bottom: 12px;">
          <span>New Balance With Supplier:</span>
          <span id="txtNewBalance">$0.00</span>
        </div>

        <button class="btn-commit purchase" onclick="draftEngine.commit(this)">+ COMMIT STOCK IN (PURCHASE)</button>
      </div>
    </aside>

  </div>

  <!-- Reusable Touch Selection Modal -->
  <div class="modal-overlay" id="unitModal">
    <div class="modal-content">
      <h3 id="modalProductName">Select Unit & Quantity</h3>
      <p id="modalStockInfo" style="font-size:0.85rem; color:#64748b; margin: 8px 0;"></p>
      
      <div class="unit-toggle-group">
        <button class="unit-btn active" id="btnUnitCarton" onclick="setModalUnit('CARTON')">Carton</button>
        <button class="unit-btn" id="btnUnitSpool" onclick="setModalUnit('SPOOL')">Spool</button>
      </div>

      <div class="counter-box">
        <button class="btn-circle" onclick="adjustModalQty(-1)">-</button>
        <span class="qty-display" id="qtyDisplay">1</span>
        <button class="btn-circle" onclick="adjustModalQty(1)">+</button>
      </div>

      <div class="price-box">
        <label style="font-size:0.85rem; font-weight:bold;">Inward Cost per Unit ($):</label>
        <input type="number" id="modalPriceInput" step="10.00">
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-confirm" onclick="confirmAddItem()">Add to Sheet</button>
      </div>
    </div>
  </div>

  <script src="js/nav.js"></script>
  <script src="js/cascade.js"></script>
  <script src="js/invoice-draft.js"></script>
  <script>
// Initialized for Stock IN (Purchases)
    const draftEngine = new InvoiceDraftEngine('IN', 'partySelect', 'invoiceItemsBody');
    const catalog = new CatalogDrillDown('purTiles', 'purBreadcrumbs', (p) => draftEngine.openAddModal(p));
  </script>
</body>
</html>
